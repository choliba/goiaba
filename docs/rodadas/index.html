<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rodadas do agents/02.ts</title>
  <meta name="claude:viewport-fit-sides" content="cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
  />
  <style>
    /* Layout: four swimlanes (você, analista, programador, revisor); scenes sit in the lane of who acts, handoffs cross lanes as arrows. */
    :root {
      --bg: #fbf7f7;
      --surface: #ffffff;
      --ink: #2a1f23;
      --muted: #6f5f65;
      --line: #e7dadd;
      --guava: #c93d5f; /* analista, and the page accent */
      --violet: #5552c9; /* programador */
      --leaf: #3b7a37; /* revisor */
      --you: #4b3e43; /* você */
      --warn: #b9450f;
      --warn-bg: #fdf0e8;
      --code-bg: #f4ecee;
      --ok-bg: #eaf4e8;
      --display:
        'IBM Plex Sans Condensed', 'Arial Narrow', system-ui, sans-serif;
      --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) {
        --bg: #161113;
        --surface: #201a1d;
        --ink: #f1e8ea;
        --muted: #b3a2a8;
        --line: #3a2e33;
        --guava: #f17a95;
        --violet: #a3a1ff;
        --leaf: #86c77d;
        --you: #d8cbd0;
        --warn: #ff9a5c;
        --warn-bg: #3a2218;
        --code-bg: #2c2327;
        --ok-bg: #1d2a1b;
        color-scheme: dark;
      }
    }
    :root[data-theme='dark'] {
      --bg: #161113;
      --surface: #201a1d;
      --ink: #f1e8ea;
      --muted: #b3a2a8;
      --line: #3a2e33;
      --guava: #f17a95;
      --violet: #a3a1ff;
      --leaf: #86c77d;
      --you: #d8cbd0;
      --warn: #ff9a5c;
      --warn-bg: #3a2218;
      --code-bg: #2c2327;
      --ok-bg: #1d2a1b;
      color-scheme: dark;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.55 var(--body);
    }
    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding-block: 32px 64px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      display: grid;
      gap: 36px;
    }

    header {
      display: grid;
      gap: 10px;
      max-width: 68ch;
    }
    .eyebrow {
      font: 500 12px/1 var(--mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--guava);
    }
    h1 {
      font: 700 clamp(28px, 4vw, 40px)/1.08 var(--display);
      margin: 0;
      text-wrap: balance;
    }
    header p {
      margin: 0;
      color: var(--muted);
    }
    code {
      font: 0.88em/1.4 var(--mono);
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 4px;
      overflow-wrap: anywhere;
    }

    /* Summary of what went wrong */
    .summary {
      display: grid;
      gap: 14px;
    }
    .summary h2,
    .next h2 {
      font: 600 20px/1.2 var(--display);
      margin: 0;
    }
    .issues {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }
    .issues li {
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 3px solid var(--warn);
      border-radius: 6px;
      padding: 12px 14px;
      display: grid;
      gap: 4px;
      min-width: 0;
    }
    .issues strong {
      font-weight: 600;
    }
    .issues a {
      font: 500 12px/1 var(--mono);
      color: var(--warn);
      text-decoration: none;
      justify-self: start;
    }
    .issues a:hover,
    .issues a:focus-visible {
      text-decoration: underline;
    }

    /* Lanes header */
    .lanes,
    .flow {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 16px;
    }
    .lanes {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 5;
      background: var(--bg);
      padding-block: 10px;
      border-bottom: 1px solid var(--line);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      z-index: 10;
      background: var(--bg);
    }
    .lane-head {
      display: grid;
      gap: 2px;
      text-align: center;
      min-width: 0;
    }
    .lane-head b {
      font: 600 16px/1.2 var(--display);
      color: var(--c);
    }
    .lane-head span {
      font: 12px/1.3 var(--mono);
      color: var(--muted);
    }

    .you {
      --c: var(--you);
    }
    .analista {
      --c: var(--guava);
    }
    .programador {
      --c: var(--violet);
    }
    .revisor {
      --c: var(--leaf);
    }

    /* Flow */
    .flow-wrap {
      position: relative;
      display: grid;
      gap: 0;
    }
    .guides {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 16px;
      pointer-events: none;
    }
    .guides i {
      justify-self: center;
      width: 0;
      border-left: 1px dashed var(--line);
    }
    .flow {
      position: relative;
      row-gap: 0;
    }

    .scene {
      background: var(--surface);
      border: 1px solid var(--line);
      border-top: 3px solid var(--c);
      border-radius: 8px;
      padding: 12px 14px 14px;
      display: grid;
      gap: 8px;
      min-width: 0;
      scroll-margin-top: 90px;
    }
    .scene.warn {
      border-color: var(--warn);
      border-top-color: var(--c);
      box-shadow: 0 0 0 1px var(--warn) inset;
    }
    .scene-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .scene-num {
      font: 500 12px/1 var(--mono);
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .scene-who {
      font: 600 12px/1 var(--mono);
      color: var(--c);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: none;
    }
    .scene h3 {
      font: 600 16px/1.25 var(--display);
      margin: 0;
      flex-basis: 100%;
      text-wrap: balance;
    }
    .scene p {
      margin: 0;
    }
    .scene ul {
      margin: 0;
      padding-left: 18px;
      display: grid;
      gap: 2px;
    }
    .quote {
      font: 13px/1.5 var(--mono);
      background: var(--code-bg);
      border-radius: 6px;
      padding: 8px 10px;
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .scene.you-line .quote {
      background: transparent;
      padding: 0;
      font-size: 14px;
    }
    .scene.you-line .quote::before {
      content: '› ';
      color: var(--muted);
    }
    .flag {
      background: var(--warn-bg);
      color: var(--ink);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13.5px;
      display: grid;
      gap: 2px;
    }
    .flag.ok {
      background: var(--ok-bg);
    }
    .flag.ok b {
      color: var(--leaf);
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 860px;
      font-size: 14px;
    }
    th,
    td {
      text-align: left;
      vertical-align: top;
      padding: 10px 14px;
      border-top: 1px solid var(--line);
    }
    thead th {
      border-top: 0;
      font: 600 13px/1.2 var(--mono);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    tbody th {
      font-weight: 600;
      width: 22%;
    }
    td.good {
      color: var(--leaf);
    }
    td.bad {
      color: var(--warn);
    }
    .note {
      margin: 0;
      color: var(--muted);
      max-width: 72ch;
    }
    header a {
      color: var(--guava);
    }
    .flag b {
      color: var(--warn);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-family: var(--mono);
    }

    /* Handoffs: an arrow from one lane to another */
    .handoff {
      position: relative;
      height: 46px;
      display: grid;
      align-items: center;
      min-width: 0;
    }
    .handoff .line {
      position: absolute;
      left: 12.5%;
      right: 12.5%;
      top: 50%;
      border-top: 1.5px solid var(--hc, var(--muted));
    }
    .handoff.warn {
      --hc: var(--warn);
    }
    .handoff .line::after {
      content: '';
      position: absolute;
      top: -6px;
      border: 5.5px solid transparent;
    }
    .handoff.ltr .line::after {
      right: -2px;
      border-left: 8px solid var(--hc, var(--muted));
      border-right: 0;
    }
    .handoff.rtl .line::after {
      left: -2px;
      border-right: 8px solid var(--hc, var(--muted));
      border-left: 0;
    }
    .handoff span {
      position: relative;
      justify-self: center;
      background: var(--bg);
      padding: 1px 8px;
      font: 12px/1.35 var(--mono);
      color: var(--hc, var(--muted));
      text-align: center;
      max-width: 92%;
      transform: translateY(-11px);
    }
    .handoff .mobile-label {
      display: none;
    }

    .end {
      grid-column: 1 / -1;
      justify-self: center;
      margin-top: 18px;
      font: 500 12px/1 var(--mono);
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* What to change */
    .next {
      display: grid;
      gap: 12px;
      max-width: 72ch;
    }
    .next ol {
      margin: 0;
      padding-left: 20px;
      display: grid;
      gap: 6px;
    }

    :focus-visible {
      outline: 2px solid var(--guava);
      outline-offset: 2px;
    }

    @media (max-width: 760px) {
      .lanes,
      .guides {
        display: none;
      }
      .flow {
        grid-template-columns: minmax(0, 1fr);
      }
      .scene,
      .handoff {
        grid-column: 1 / -1 !important;
      }
      .scene-who {
        display: inline;
      }
      .handoff {
        height: auto;
        padding-block: 8px;
        justify-items: center;
      }
      .handoff .line {
        display: none;
      }
      .handoff span {
        transform: none;
      }
      .handoff .desktop-label {
        display: none;
      }
      .handoff .mobile-label {
        display: inline;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
    html {
      scroll-behavior: smooth;
    }

    /* The rounds, on top of every page: the current one is not a link. */
    .rounds ol {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .rounds a,
    .rounds [aria-current] {
      display: grid;
      gap: 2px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      text-decoration: none;
      font-size: 13.5px;
    }
    .rounds small {
      font: 500 11px/1 var(--mono);
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .rounds a:hover,
    .rounds a:focus-visible {
      border-color: var(--guava);
    }
    .rounds [aria-current] {
      border-color: var(--guava);
      box-shadow: 0 0 0 1px var(--guava) inset;
    }

    /* The index: one card per round, in order. */
    .indice {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }
    .indice li {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      display: grid;
      gap: 6px;
      max-width: 72ch;
    }
    .indice a {
      display: grid;
      gap: 2px;
      color: var(--ink);
      text-decoration: none;
      font: 600 18px/1.25 var(--display);
    }
    .indice a:hover,
    .indice a:focus-visible {
      color: var(--guava);
    }
    .indice small {
      font: 500 11px/1 var(--mono);
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .indice p {
      margin: 0;
      color: var(--muted);
    }
  </style>

  <main class="page">
    <header>
      <span class="eyebrow">docs/rodadas</span>
      <h1>Rodadas do agents/02.ts</h1>
      <p>
        Cada rodada é o programador consultando o analista, corrigindo o que ele
        apontou e consultando o revisor. Cada página conta uma rodada cena a
        cena e a compara com as anteriores.
      </p>
    </header>
    <ol class="indice" id="rodadas-indice" aria-label="Rodadas"></ol>
    <script src="rodadas.js"></script>
  </main>
</html>
